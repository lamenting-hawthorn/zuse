# Builds the reviewed upstream source instead of relying on a mutable :latest image.
services:
  executor:
    build:
      context: https://github.com/UsefulSoftwareCo/executor.git#a6a7bf2090ce103e37e38858f91fdd6fbce4afb0
      dockerfile: apps/host-selfhost/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:4788:4788"
    environment:
      EXECUTOR_WEB_BASE_URL: ${EXECUTOR_WEB_BASE_URL:-http://localhost:4788}
    volumes:
      - executor-data:/data
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:4788/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
volumes:
  executor-data:
